repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: block-env-files
        name: block committed .env files
        entry: ".env holds API keys and must never be committed"
        language: fail
        files: '(^|/)\.env$'
      - id: block-user-files
        name: block decks and documents in input/ and output/
        entry: "input/ and output/ hold your own files and must never be committed"
        language: fail
        files: '^(input|output|logs|\.state)/(?!\.gitkeep$)'
