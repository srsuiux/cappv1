[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cappv1"
dynamic = ["version"]
description = "Writes alt text into PowerPoint and Word files using a vision model, without changing how they look."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-pptx==1.0.2",
    "python-docx==1.2.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "Pillow==10.4.0",
    "ImageHash==4.3.1",
    "olefile==0.47",
    "rich==13.9.4",
    "prompt_toolkit==3.0.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cappv1 = "cappv1.main:main"

[project.urls]
Homepage = "https://github.com/srsuiux/cappv1"
Changelog = "https://github.com/srsuiux/cappv1/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cappv1/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cappv1"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "cappv1/CHANGELOG.md"
".env.example" = "cappv1/.env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "B007", "B905"]  # E501: the formatter owns line length; the rest are deliberate in this code
