name: CI

on:
  push:
    branches: [main, "fix/**", "docs/**", "feature/**", "release/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python -m pytest -q --cov=cappv1 --cov-report=term --cov-report=xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the release tag check (the same script the Release workflow runs)
        run: |
          tag="v$(python .github/scripts/check_release_tag.py --print)"
          python .github/scripts/check_release_tag.py "$tag"
          if python .github/scripts/check_release_tag.py v0.0.0; then echo "a wrong tag was accepted"; exit 1; fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the built wheel and run it
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          cappv1 --version
          python -c "from cappv1.home import bundled_file; assert bundled_file('CHANGELOG.md') and bundled_file('.env.example')"
      - name: Keep the build for the artifact check below
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  artifacts:
    # The Release workflow passes the build between jobs with these same two actions
    # but only runs on a tag, so this job tries the pair on every push and PR.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pip install twine
      - run: twine check dist/*
