name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Check the tag matches the package version
        run: |
          version="$(python -c "exec(open('src/cappv1/version.py').read()); print(VERSION)")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build
        run: python -m build
      - name: Take the release notes from CHANGELOG.md
        run: |
          python - <<'PY' > notes.md
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not match:
              raise SystemExit(f"No section for {version} in CHANGELOG.md")
          print(match.group(1).strip())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
