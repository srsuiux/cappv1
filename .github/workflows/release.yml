name: Release

# Runs only when a version tag (vX.Y.Z) is pushed: build once, publish to PyPI
# with Trusted Publishing (no API token stored anywhere), then create the
# GitHub Release from the CHANGELOG section.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Check the tag matches the package version
        run: python .github/scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cappv1/
    permissions:
      id-token: write # lets PyPI verify this workflow run (OIDC); no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not match:
              raise SystemExit(f"No section for {version} in CHANGELOG.md")
          print(match.group(1).strip())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
