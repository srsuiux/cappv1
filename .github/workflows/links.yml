name: Links

on:
  push:
    branches: [main, "fix/**", "docs/**", "feature/**"]
  pull_request:

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments --max-retries 3 --accept '200..=299,429'
            --exclude '^https?://(localhost|127\.0\.0\.1)' '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
