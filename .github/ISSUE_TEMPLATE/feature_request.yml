name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you considered instead?
  - type: markdown
    attributes:
      value: cappv1 only writes alt text, plus a short list of visually inert fixes (see docs/scope.md). Requests that change how a file looks are out of scope.
