<body>

<div class="wrap">
<header>
  <div class="brand">cappv1</div>
  <nav aria-label="Main">
    <a href="index.html">Home</a><a href="setup.html" aria-current="page">Setup</a><a href="doctor.html">Doctor</a>

</header>
<div class="status" id="status" role="status">Loading…</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<main id="main">
<h1>Setup</h1>
<p class="muted">Choose which AI service describes your slides. You can change this any time.</p>
<div id="problem"></div>
<form id="form">
  <fieldset><legend>AI service</legend><div id="services"></div></fieldset>
  <label class="f" for="model">Model</label>
  <select id="model"></select>
  <div id="other" hidden><label class="f" for="othername">Model name</label><input id="othername" type="text" autocomplete="off" spellcheck="false"></div>
  <div id="keybox" hidden>
    <label class="f" for="key">API key</label>
    <input id="key" type="password" autocomplete="off" aria-describedby="keyhelp">
    <p id="keyhelp" class="muted"></p>
  </div>
  <div class="actions"><button type="submit" id="save">Save</button></div>
  <div id="result"></div>
</form>
</main>
</div>
<script type="module" src="setup.js"></script>
</body>
